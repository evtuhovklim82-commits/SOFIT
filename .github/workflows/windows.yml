name: Windows installer and portable build
on:
  workflow_dispatch:
  push:
    # Run the same portable build on a candidate before advancing main.
    branches: [main, 'ci/windows/**']
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --target sofit_production_tests
      - name: Run all SOFIT tests
        id: ctest
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'ctest-release.xml'
          ctest --test-dir build -C Release -R '^sofit_production$' --output-on-failure --no-tests=error --output-junit $report
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0 -and (Test-Path $report)) {
            [xml]$junit = Get-Content -LiteralPath $report -Raw
            foreach ($test in $junit.SelectNodes('//testcase[failure or error]')) {
              $detail = [string]$test.'system-out'
              if ($detail.Length -gt 2000) { $detail = $detail.Substring($detail.Length - 2000) }
              $message = "$($test.name): $($test.failure.message)`n$detail"
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows CTest::$message"
            }
          }
          exit $testExit
      - name: Upload CTest diagnostics after failure
        if: ${{ failure() && steps.ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: SOFIT-Windows-CTest
          path: |
            ctest-release.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
      - name: Compare with the first DXF reader closed
        if: ${{ failure() && steps.ctest.outcome == 'failure' }}
        shell: pwsh
        env:
          SOFIT_CLOSE_DXF_BEFORE_REEXPORT: '1'
        run: |
          ctest --test-dir build -C Release -R '^sofit_production$' --output-on-failure --no-tests=error
          $testExit = $LASTEXITCODE
          Write-Output "::notice title=CTest with DXF reader closed::Exit code $testExit"
          exit $testExit
