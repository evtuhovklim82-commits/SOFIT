name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SOFIT | Out-Null
          Copy-Item build/Release/sofit.exe dist/SOFIT/SOFIT.exe
          windeployqt --release --no-translations dist/SOFIT/SOFIT.exe
          Compress-Archive -Path dist/SOFIT -DestinationPath SOFIT-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SOFIT-Windows-x64
          path: SOFIT-Windows-x64.zip
