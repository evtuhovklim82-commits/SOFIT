name: Windows installer and portable build
on:
  workflow_dispatch:
  push:
    # Run the same portable build on a candidate before advancing main.
    branches: [main, 'ci/windows/**']
  pull_request:
    branches: [main]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Run all SOFIT tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Run GUI workflow at 150% scaling
        shell: pwsh
        env:
          QT_SCALE_FACTOR: '1.5'
        run: ctest --test-dir build -C Release -R '^sofit_pattern_workflow$' --output-on-failure --no-tests=error
      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/SOFIT | Out-Null
          Copy-Item build/Release/sofit.exe dist/SOFIT/SOFIT.exe
          windeployqt --release --no-translations --no-compiler-runtime dist/SOFIT/SOFIT.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found' }
          $crt = Get-Item "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (!$crt) { throw 'MSVC 2022 x64 redistributable DLLs not found' }
          Copy-Item "$($crt.FullName)/*.dll" dist/SOFIT
          foreach ($file in @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "platforms/qwindows.dll", "vcruntime140.dll", "msvcp140.dll")) {
            if (!(Test-Path "dist/SOFIT/$file")) { throw "Missing runtime file $file" }
          }
          Copy-Item README.md, LICENSE-NOTICE.txt dist/SOFIT
          Copy-Item -Recurse examples dist/SOFIT/examples
          Compress-Archive -Path dist/SOFIT -DestinationPath SOFIT-Windows-x64.zip
      - name: Launch the extracted portable package
        shell: pwsh
        run: |
          Expand-Archive SOFIT-Windows-x64.zip -DestinationPath package-smoke
          $package = (Resolve-Path package-smoke/SOFIT).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          foreach ($name in @('bib-apron', 'graded-skirt', 'linked-trousers')) {
            $project = Join-Path $package "examples/$name.sofit"
            if (!(Test-Path $project)) { throw "Missing example $name" }
            $process = Start-Process -FilePath (Join-Path $package 'SOFIT.exe') `
              -WorkingDirectory $env:RUNNER_TEMP -ArgumentList '--packaging-smoke', ('"' + $project + '"') -PassThru
            if (!$process.WaitForExit(30000)) {
              $process.Kill()
              throw "Portable SOFIT did not exit for $name"
            }
            if ($process.ExitCode -ne 0) { throw "Portable SOFIT failed for ${name}: $($process.ExitCode)" }
          }
      - name: Compile Inno Setup installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(SOFIT VERSION ([0-9.]+)').Groups[1].Value
          if (!$version) { throw "Missing SOFIT version" }
          & $iscc "/DAppVersion=$version" packaging/SOFIT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, launch and uninstall SOFIT
        shell: pwsh
        run: |
          function Run-Checked($file, $arguments) {
            $process = Start-Process -FilePath $file -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(120000)) {
              $process.Kill()
              throw "Timed out running $file"
            }
            if ($process.ExitCode -ne 0) { throw "$file exited with $($process.ExitCode)" }
          }
          $app = Join-Path $env:RUNNER_TEMP 'SOFIT Installed'
          $setup = (Resolve-Path dist/SOFIT-Windows-x64-Setup.exe).Path
          Run-Checked $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$app`"", '/TASKS=associate,desktopicon')
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'SOFIT.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'SOFIT.lnk'
          foreach ($link in @($shortcut, $desktop)) {
            if (!(Test-Path $link)) { throw "Missing shortcut $link" }
          }
          $key = 'HKCU:/Software/Classes/SOFIT.Pattern/shell/open/command'
          $expected = '"{0}" "%1"' -f (Join-Path $app 'SOFIT.exe')
          if ((Get-Item $key).GetValue('') -ne $expected) { throw 'Invalid .sofit shell command' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $project = Join-Path $app 'examples/linked-trousers.sofit'
          Run-Checked (Join-Path $app 'SOFIT.exe') @('--packaging-smoke', ('"' + $project + '"'))
          Run-Checked (Join-Path $app 'unins000.exe') @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          foreach ($path in @((Join-Path $app 'SOFIT.exe'), $shortcut, $desktop, $key)) {
            if (Test-Path $path) { throw "Uninstall left $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SOFIT-Windows-x64
          path: |
            SOFIT-Windows-x64.zip
            dist/SOFIT-Windows-x64-Setup.exe
          if-no-files-found: error
