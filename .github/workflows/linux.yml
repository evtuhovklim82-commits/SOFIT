name: Linux native build
on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/windows/**']
  pull_request:
    branches: [main]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [system, '6.8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libxcb-cursor0
      - name: Install Qt 6.8.3
        if: matrix.qt == '6.8.3'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        if: matrix.qt == 'system'
        run: cpack --config build/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        if: matrix.qt == 'system'
        with:
          name: SOFIT-Linux-x64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
